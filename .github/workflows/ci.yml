name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:

permissions:
  contents: read

# Cancel previous PR builds.
concurrency:
  # Cancel all workflow runs except latest within a concurrency group. This is achieved by defining a concurrency group for the PR.
  # Non-PR builds have singleton concurrency groups.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version:
          - 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'
      - name: Set up mvnd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.0.6 --repo apache/maven-mvnd --pattern maven-mvnd-1.0.6-linux-amd64.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/maven-mvnd-1.0.6-linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maven-mvnd-1.0.6-linux-amd64/bin" >> "$GITHUB_PATH"
      - name: Build and test
        run: mvnd verify -B -V -P ci
